# UNODE vision add-on: bench camera check (iteration 2, step 1)
# Hardware: AI-Thinker ESP32-CAM (OV2640), powered from a solid 5 V USB supply.
# Purpose: prove the camera works, check image quality and framing, measure current.
# This is a bench tool, not node firmware: it serves JPEG snapshots/stream over HTTP
# so you can look at the panel from a browser. No Home Assistant needed.
#
#   Stream:   http://<camera IP>:8080/
#   Snapshot: http://<camera IP>:8081/
#
# Status: UNVERIFIED. Pin map is the AI-Thinker map from the ESPHome docs; check with
# `esphome config` on the dev box. If the camera fails to start ("Camera probe failed"),
# the board is often a clone with a different map or a loose camera ribbon.

substitutions:
  name: unode-vision-camcheck
  friendly_name: UNODE Vision Camera Check

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32cam

psram:

logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Bench tool on USB power: keep the radio awake. (Its own effect was not isolated, see
  # docs/vision-addon.md "ESP32-CAM on a weak Wi-Fi link".)
  power_save_mode: none
  ap:
    ssid: "UNODE-CAM-Fallback"
    password: !secret fallback_password

captive_portal:

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27

esp32_camera:
  name: "Panel camera"
  external_clock:
    pin: GPIO0
    # 8 MHz, not the 20 MHz default: the camera clock interfered with this board's Wi-Fi and
    # slowed the stream to 0.3 frames/s; at 8 MHz it ran at 4.6 (measured). 10 MHz was worse than
    # 20 MHz, so this may depend on the router channel: re-test on a new site.
    frequency: 8MHz
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  # Small frames keep the stream fast on a weak link (8.6 frames/s here; 800x600 gave 4.6).
  # LEDs are only a few pixels wide at this size; raise it for a closer look at a panel.
  resolution: 320x240
  jpeg_quality: 25

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

output:
  - platform: gpio
    pin: GPIO4
    id: flash_led_out

light:
  # On-board flash LED. Keep OFF when reading panel LEDs (it washes them out);
  # useful only to see the panel labels in the dark during setup.
  - platform: binary
    output: flash_led_out
    name: "Flash LED"

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
